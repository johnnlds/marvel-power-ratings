name: Refresh Marvel alias search index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/build_alias_index.py"
      - ".github/workflows/refresh-alias-index.yml"

permissions:
  contents: write

concurrency:
  group: alias-index-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build full alias index from Marvel Fandom
        run: python scripts/build_alias_index.py
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alias-index.json
          if git diff --cached --quiet; then
            echo "Alias index is unchanged."
          else
            git commit -m "Refresh Marvel source alias index"
            git push
          fi
